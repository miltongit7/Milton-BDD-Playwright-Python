name: Python Playwright BDD Tests

on:
  push:
    branches:
      - Milton-Release-BDD
  pull_request:
    branches:
      - main

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref == 'Milton-Release-BDD')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install

      - name: Run tests
        run: pytest -q
